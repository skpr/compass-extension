[package]
name = "compass-extension"
version = "0.1.0"
edition = "2024"

[lib]
name = "compass_extension"
crate-type = ["lib", "cdylib"]

[dependencies]
anyhow = "1.0.100"
quanta = "0.12"
phper = "0.17.2"
probe = "0.5.2"
once_cell = "1.21.3"
tracing = "0.1.44"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
