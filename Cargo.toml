[package]
name = "compass-extension"
version = "0.1.0"
edition = "2024"

[lib]
name = "compass_extension"
crate-type = ["lib", "cdylib"]
# `cargo test` builds the lib target as an executable, and executables - unlike
# shared objects - cannot tolerate the undefined Zend symbols that PHP resolves
# at dlopen time. Without this, `cargo test` fails to link with a wall of
# "undefined reference to zend_hash_index_find" rather than anything useful.
# Real unit tests need the pure logic split into a crate with no phper
# dependency; see scripts/validate-probes.sh for what is checked today.
test = false

[dependencies]
anyhow = "1.0.100"
quanta = "0.12"
phper = "0.17.2"
probe = "0.5.2"
once_cell = "1.21.3"
nix = "0.30.1"
chrono = "0.4.43"
tracing = "0.1.44"
uuid = { version = "1", features = ["v4"] }
rustc-hash = "2.1.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
