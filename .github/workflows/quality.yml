name: 📋 Quality

on:
  pull_request:
    types: [ synchronize, opened, reopened, ready_for_review ]

concurrency:
  group: quality-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    # phper generates its bindings from the PHP headers, so clippy has to see each version.
    strategy:
      matrix:
        php: [ "8.4", "8.6" ]

    steps:
      - name: ⬇️ Git clone the repository
        uses: actions/checkout@v4

      - name: 📦 Build devcontainer
        run: |
          docker build --build-arg PHP_VERSION=${{ matrix.php }} -t localhost/devcontainer .devcontainer

      - name: 📋 Clippy
        run: |
          docker run --rm -v $(pwd):$(pwd) -w $(pwd) localhost/devcontainer mise clippy

      - name: 📋 Format
        run: |
          docker run --rm -v $(pwd):$(pwd) -w $(pwd) localhost/devcontainer mise lint

      - name: 📋 Probe Guard
        run: |
          docker run --rm -v $(pwd):$(pwd) -w $(pwd) localhost/devcontainer mise probe-guard

  smoke:
    name: Smoke Test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: [ "8.4", "8.6" ]

    steps:
      - name: ⬇️ Git clone the repository
        uses: actions/checkout@v4

      - name: 📦 Build devcontainer
        run: |
          docker build --build-arg PHP_VERSION=${{ matrix.php }} -t localhost/devcontainer .devcontainer

      - name: 🧪 Smoke Test
        run: |
          docker run --rm -v $(pwd):$(pwd) -w $(pwd) localhost/devcontainer mise smoke
